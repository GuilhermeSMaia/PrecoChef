quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/precochef?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
quarkus.datasource.username=root
quarkus.datasource.password=Gui04102004?
# INFO deixa o terminal só com o que interessa (coleta, sincronização, avisos e erros);
# para investigar algo, troque por DEBUG só na categoria, ex.: quarkus.log.category."org.scraper".level=DEBUG
quarkus.log.level=INFO
# cópia do log em arquivo (BackEnd/logs/quarkus.log), para ver depois o que aconteceu numa coleta longa
quarkus.log.file.enable=true
quarkus.log.file.path=logs/quarkus.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQL8Dialect

quarkus.hibernate-orm.jdbc.statement-batch-size=100

quarkus.hibernate-orm.show-sql=false
quarkus.hibernate-orm.format-sql=true

# sintaxe do JBoss Logging: %p = nível, %c{1.} = classe abreviada, %s = mensagem, %e = stack trace do erro
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{1.}] %s%e%n
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n

quarkus.http.cors=true
%dev.quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET, POST, PUT, DELETE

# ---- login (JWT assinado com HS256) ----
# segredo dos tokens em base64url, com 32 bytes ou mais. Para gerar um:
#   python -c "import secrets,base64;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode().rstrip('='))"
# Em produção é obrigatório definir JWT_SEGREDO; o valor de dev abaixo é só para uso local
jwt.segredo=${JWT_SEGREDO:XGGjc96CI92vFjW4i8AqWQAdgMwhXK786DdH_R59DY4}
%prod.jwt.segredo=${JWT_SEGREDO}
jwt.duracao-horas=8
mp.jwt.verify.issuer=precochef
# a smallrye-jwt espera a chave secreta no formato JWK ("oct"), tanto para assinar quanto para verificar.
# Definir a de assinatura também impede o Quarkus dev de gerar um par RSA próprio (que recusaria nossos tokens)
smallrye.jwt.sign.key={"kty":"oct","k":"${jwt.segredo}"}
smallrye.jwt.new-token.signature-algorithm=HS256
smallrye.jwt.verify.secretkey={"kty":"oct","k":"${jwt.segredo}"}
mp.jwt.verify.publickey.algorithm=HS256

# primeiro admin, criado na inicialização se ainda não existir nenhum (ver org.auth.AdminInicial)
admin.email=${ADMIN_EMAIL:}
admin.senha=${ADMIN_SENHA:}
%dev.admin.email=${ADMIN_EMAIL:admin@precochef.com}
%dev.admin.senha=${ADMIN_SENHA:Admin12345}

scraping.cron.expr=0 0 4 * * ?

# junção de produtos iguais com nomes diferentes entre mercados, feita por IA (Claude).
# A chave vem da variável de ambiente ANTHROPIC_API_KEY; sem ela, a junção fica desligada.
juncao.ia.api-key=${ANTHROPIC_API_KEY:}
juncao.ia.modelo=claude-opus-5-5
# roda sozinha ao fim de cada ciclo agendado de webscraping
juncao.ia.apos-scraping=true

# Irmãos Gonçalves 
scraping.irmaosgoncalves.nome-mercado=Irmãos Gonçalves
scraping.irmaosgoncalves.base-url=https://www.irmaosgoncalves.com.br
scraping.irmaosgoncalves.categoria=/
scraping.irmaosgoncalves.max-paginas=2000
scraping.irmaosgoncalves.delay-ms=500

# Atacadão (VTEX)
scraping.atacadao.nome-mercado=Atacadão
scraping.atacadao.base-url=https://www.atacadao.com.br
# slugs dos departamentos do site (atacadao.com.br/{slug}), separados por vírgula
scraping.atacadao.departamentos=mercearia,carnes-aves-e-peixes,hortifruti,padaria-e-matinais,frios-e-congelados,bebidas,limpeza,higiene-e-perfumaria
scraping.atacadao.delay-ms=1000
# o CEP escolhe a filial (preço e estoque). A loja de Porto Velho não vende pelo site;
# 78005000 = Cuiabá, cuja tabela bate com os encartes de Rondônia.
# Se nenhuma filial atender o CEP, a coleta é abortada e nada é gravado
scraping.atacadao.cep=78005000

# Nova Era (VTEX)
scraping.novaera.nome-mercado=Nova Era
scraping.novaera.base-url=https://www.supernovaera.com.br
# o CEP escolhe a loja (preço e estoque). 76801000 = Porto Velho. A busca do site sempre
scraping.novaera.cep=76801000
scraping.novaera.delay-ms=500

# Meta 21 (Instabuy) - o nome precisa ser IGUAL ao cadastrado na tabela mercados
scraping.meta21.nome-mercado=Meta 21
# coleta pelo site (sitemap.xml + uma página por produto); a API da Instabuy bloqueia com poucas requisições
scraping.meta21.site-url=https://supermercadometa21.instabuy.app.br
# pausa entre páginas de produto; o site bloqueia (HTTP 429) acima de ~60 páginas/min
# ~5 mil páginas x (1s + ~0,5s de resposta) = ~2h
scraping.meta21.delay-ms=1000
# espera após um bloqueio (HTTP 429) antes de repetir a mesma página (até 4 vezes seguidas)
scraping.meta21.espera-bloqueio-ms=120000


quarkus.http.host=0.0.0.0
quarkus.http.port=8080
